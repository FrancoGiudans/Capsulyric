name: Changelog Release

on:
  push:
    paths:
      - 'CHANGELOG.md'
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 26.6.1, 26.6.Preview, Preview, or empty for auto)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      discussions: write

    steps:
      # ============================================================
      # Step 1: Checkout
      # ============================================================
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Gitee token
        id: gitee_check
        shell: bash
        run: |
          HAS="${{ secrets.gitee_token || secrets.GITEE_TOKEN }}"
          if [ -n "$HAS" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # Step 2: Parse commit message, CHANGELOG.md, and codename
      # ============================================================
      - name: Parse Metadata
        id: meta
        shell: bash
        run: |
          set -e

          # --- Parse commit message or workflow_dispatch input ---
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            echo "Manual trigger — version input: '${RAW}'"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            # Protected branches: the marker arrives via the PR title inside a
            # merge/squash commit message, so take the first line containing it.
            RAW=$(echo "$COMMIT_MSG" | grep -m 1 -o '\[release\].*' | sed -E 's/^\[release\][[:space:]]*//' | xargs || true)
            echo "Commit raw version input: '${RAW}'"
          fi

          # Auto prefix: YY.M (Shanghai timezone)
          AUTO_PREFIX="$(TZ=Asia/Shanghai date +'%y').$(TZ=Asia/Shanghai date +'%-m')"

          # Defaults
          CHANNEL="Stable"
          VERSION_NUMS=""

          if [ -z "$RAW" ]; then
            # Bare [release] -> auto everything
            CHANNEL="Stable"
            VERSION_NUMS=""
          else
            # Check if last dot-separated segment is a channel word
            LAST_PART=$(echo "$RAW" | grep -oE '[^.]+$' || echo "")
            LAST_PART_LOWER=$(echo "$LAST_PART" | tr '[:upper:]' '[:lower:]')
            case "$LAST_PART_LOWER" in
              preview)
                CHANNEL="Preview"
                VERSION_NUMS="${RAW%.*}"
                ;;
              stable)
                CHANNEL="Stable"
                VERSION_NUMS="${RAW%.*}"
                ;;
              experiment)
                CHANNEL="Experiment"
                VERSION_NUMS="${RAW%.*}"
                ;;
              *)
                # No channel word - entire RAW is version numbers
                CHANNEL="Stable"
                VERSION_NUMS="$RAW"
                ;;
            esac
          fi

          if [ -z "$VERSION_NUMS" ]; then
            VERSION_PREFIX="$AUTO_PREFIX"
          else
            VERSION_PREFIX="${VERSION_NUMS}"
          fi

          echo "version_prefix=${VERSION_PREFIX}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

          # --- Determine prerelease flag ---
          IS_PRERELEASE="false"
          if [ "$CHANNEL" = "Preview" ] || [ "$CHANNEL" = "Experiment" ]; then
            IS_PRERELEASE="true"
          fi

          # --- Read codename from gradle.properties ---
          CODENAME=$(sed -n 's/^[[:space:]]*appCodename[[:space:]]*=[[:space:]]*//p' gradle.properties | tail -n 1 | tr -d '\r')
          if [ -z "$CODENAME" ]; then
            CODENAME="Unassigned"
          fi
          echo "codename=${CODENAME}" >> $GITHUB_OUTPUT

          # --- Compute version name and tag ---
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_NAME="${VERSION_PREFIX}.${CHANNEL}_C${COMMIT_COUNT}"
          TAG_NAME="Version.${VERSION_NAME}"

          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "commit_count=${COMMIT_COUNT}" >> $GITHUB_OUTPUT

          # --- Determine build type and APK paths ---
          if [ "$IS_PRERELEASE" = "true" ]; then
            BUILD_TYPE="Prerelease"
            APK_DIR="app/build/outputs/apk/prerelease"
            SIGNED_APK="${APK_DIR}/app-prerelease-signed.apk"
          else
            BUILD_TYPE="Release"
            APK_DIR="app/build/outputs/apk/release"
            SIGNED_APK="${APK_DIR}/app-release-signed.apk"
          fi

          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "apk_dir=${APK_DIR}" >> $GITHUB_OUTPUT
          echo "signed_apk=${SIGNED_APK}" >> $GITHUB_OUTPUT

          # --- Parse CHANGELOG.md (line-number-based, avoids awk Unicode regex issues) ---

          TOTAL_LINES=$(wc -l < CHANGELOG.md)
          echo "CHANGELOG.md has ${TOTAL_LINES} lines"

          # Collect all heading line numbers (lines starting with "## ")
          HEADING_LINES=$(grep -n '^## ' CHANGELOG.md | cut -d: -f1 || true)
          echo "Heading lines: $(echo $HEADING_LINES | tr '\n' ' ')"

          # Find specific headings by matching partial ASCII/CJK text on each heading line
          find_heading_line() {
            local keyword="$1"
            for hl in $HEADING_LINES; do
              if sed -n "${hl}p" CHANGELOG.md | grep -qF "$keyword" 2>/dev/null; then
                echo "$hl"
                return 0
              fi
            done
            echo ""
          }

          META_LINE=$(find_heading_line "Release Metadata")
          CN_LINE=$(find_heading_line "Release Highlights")
          EN_LINE=$(find_heading_line "English Highlights")

          echo "Found headings: Metadata@${META_LINE:-N/A}  CN@${CN_LINE:-N/A}  EN@${EN_LINE:-N/A}"

          # Helper: get the first heading line number greater than a given line
          next_heading_after() {
            local after="$1"
            for hl in $HEADING_LINES; do
              if [ "$hl" -gt "$after" ] 2>/dev/null; then
                echo "$hl"
                return 0
              fi
            done
            echo "$((TOTAL_LINES + 1))"
          }

          # --- Parse Preview flag from Release Metadata section ---
          CHANGELOG_PREVIEW=""
          if [ -n "$META_LINE" ]; then
            META_END=$(next_heading_after "$META_LINE")
            META_SECTION=$(sed -n "${META_LINE},$((META_END - 1))p" CHANGELOG.md || true)
            CHANGELOG_PREVIEW=$(echo "$META_SECTION" | grep -i 'preview' | grep -oE '`(true|false)`' | tr -d '`' | head -n 1 || true)
          fi
          echo "CHANGELOG Preview flag: '${CHANGELOG_PREVIEW:-not set}'"

          if [ "${CHANGELOG_PREVIEW,,}" = "true" ]; then
            echo "CHANGELOG overrides: Preview=true"

            # Override channel to Preview (CHANGELOG flag always wins)
            CHANNEL="Preview"
            IS_PRERELEASE="true"
            BUILD_TYPE="Prerelease"
            APK_DIR="app/build/outputs/apk/prerelease"
            SIGNED_APK="${APK_DIR}/app-prerelease-signed.apk"

            # Recompute version name and tag with the new channel
            VERSION_NAME="${VERSION_PREFIX}.${CHANNEL}_C${COMMIT_COUNT}"
            TAG_NAME="Version.${VERSION_NAME}"

            echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
            echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
            echo "apk_dir=${APK_DIR}" >> $GITHUB_OUTPUT
            echo "signed_apk=${SIGNED_APK}" >> $GITHUB_OUTPUT
          fi
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

          # --- Extract CN notes ---
          CN_NOTES=""
          if [ -n "$CN_LINE" ]; then
            CN_END=$(next_heading_after "$CN_LINE")
            CN_NOTES=$(sed -n "$((CN_LINE + 1)),$((CN_END - 1))p" CHANGELOG.md || true)
          fi

          # --- Extract EN notes ---
          EN_NOTES=""
          if [ -n "$EN_LINE" ]; then
            EN_END=$(next_heading_after "$EN_LINE")
            EN_NOTES=$(sed -n "$((EN_LINE + 1)),$((EN_END - 1))p" CHANGELOG.md || true)
          fi

          # Validate sections are non-empty (after stripping blank lines)
          CN_TRIMMED=$(echo "$CN_NOTES" | sed '/^[[:space:]]*$/d' || true)
          EN_TRIMMED=$(echo "$EN_NOTES" | sed '/^[[:space:]]*$/d' || true)

          echo "CN notes: $(echo "$CN_NOTES" | wc -l) lines (${#CN_TRIMMED} non-blank chars)"
          echo "EN notes: $(echo "$EN_NOTES" | wc -l) lines (${#EN_TRIMMED} non-blank chars)"

          if [ -z "$CN_TRIMMED" ] && [ -z "$EN_TRIMMED" ]; then
            echo "::error::Both highlights sections in CHANGELOG.md are empty. Please fill in at least one before opening the release PR."
            exit 1
          fi

          # Save notes to temp files for later assembly
          echo "$CN_NOTES" > /tmp/cn_notes.txt
          echo "$EN_NOTES" > /tmp/en_notes.txt

          # --- Check for tag conflicts ---
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Git tag '${TAG_NAME}' already exists. Please adjust the version in your release PR title."
            exit 1
          fi

          # --- Summary ---
          echo "============================================"
          echo " Version:       ${VERSION_NAME}"
          echo " Tag:           ${TAG_NAME}"
          echo " Channel:       ${CHANNEL}"
          echo " Prerelease:    ${IS_PRERELEASE}"
          echo " Build Type:    ${BUILD_TYPE}"
          echo " Codename:      ${CODENAME}"
          echo "============================================"

      # ============================================================
      # Step 3: Set up JDK 26
      # ============================================================
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      # ============================================================
      # Step 4: Setup Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ============================================================
      # Step 5: Build APK
      # ============================================================
      - name: Build ${{ steps.meta.outputs.build_type }} APK
        run: |
          ./gradlew :app:assemble${{ steps.meta.outputs.build_type }} \
            -PversionName="${{ steps.meta.outputs.version_prefix }}.${{ steps.meta.outputs.channel }}" \
            -PversionChannel="${{ steps.meta.outputs.channel }}" \
            -PappCodename="${{ steps.meta.outputs.codename }}"

      # ============================================================
      # Step 6: Sign APK
      # ============================================================
      - name: Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > release.keystore

          STD_APK=$(find ${{ steps.meta.outputs.apk_dir }} -name "*.apk" ! -name "*-signed.apk" | head -n 1)
          echo "Signing: ${STD_APK}"

          ${ANDROID_HOME}/build-tools/37.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out ${{ steps.meta.outputs.signed_apk }} \
            "$STD_APK"

          rm release.keystore
          echo "Signed APK: ${{ steps.meta.outputs.signed_apk }}"

      # ============================================================
      # Step 7: Generate MD5 Checksum
      # ============================================================
      - name: Generate MD5 Checksum
        id: md5
        run: |
          MD5_VALUE=$(md5sum "${{ steps.meta.outputs.signed_apk }}" | awk '{print $1}')
          echo "md5=${MD5_VALUE}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Step 7.5: Rename APK
      # ============================================================
      - name: Rename APK
        id: artifacts
        run: |
          FINAL_APK="Capsulyric-${{ steps.meta.outputs.version_name }}.apk"
          mv "${{ steps.meta.outputs.signed_apk }}" "$FINAL_APK"
          echo "Renamed APK: ${FINAL_APK}"
          echo "apk=${FINAL_APK}" >> $GITHUB_OUTPUT

      # ============================================================
      # Step 8: Create Git Tag
      # ============================================================
      - name: Create and Push Git Tag
        run: |
          git tag "${{ steps.meta.outputs.tag_name }}"
          git push origin "${{ steps.meta.outputs.tag_name }}"
          echo "Pushed tag: ${{ steps.meta.outputs.tag_name }}"

      # ============================================================
      # Step 9: Generate Changes grouped by conventional prefix
      # (no labels, no emoji - groups: Features / Fixes / Improvements / Chores / Other)
      # ============================================================
      - name: Generate Grouped Changes
        id: auto_notes
        run: |
          # Find previous release tag for comparison:
          #   Stable -> compare against last Stable tag only
          #   Preview/Experiment -> compare against last Preview or Stable tag
          CURRENT_TAG="${{ steps.meta.outputs.tag_name }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"

          if [ "$CHANNEL" = "Stable" ]; then
            PREV_TAG=$(git tag --sort=-creatordate | grep -v "Canary" | grep -E "^Version\..*\.Stable_C" | grep -vxF "$CURRENT_TAG" | head -n 1)
            echo "Stable release - searching previous Stable tags"
          else
            PREV_TAG=$(git tag --sort=-creatordate | grep -v "Canary" | grep -E "^Version\." | grep -vxF "$CURRENT_TAG" | head -n 1)
            echo "Preview/Experiment release - searching any previous tag"
          fi
          echo "Previous tag found: ${PREV_TAG:-none}"

          if [ -n "$PREV_TAG" ]; then
            echo "Comparing against previous tag: ${PREV_TAG}"
            git log "${PREV_TAG}..HEAD" --pretty=format:'%s' --no-merges > /tmp/change_subjects.txt || true
          else
            echo "No previous tag found, using recent history."
            git log -30 --pretty=format:'%s' --no-merges > /tmp/change_subjects.txt || true
          fi

          # Group subjects by conventional-commit prefix (no labels, no emoji)
          python3 - << 'PYEOF' > /tmp/auto_notes.md
          import re
          from collections import OrderedDict
          groups = OrderedDict([("Features", []), ("Fixes", []), ("Improvements", []), ("Chores", []), ("Other", [])])
          with open("/tmp/change_subjects.txt", encoding="utf-8") as f:
              subjects = [line.strip() for line in f if line.strip()]
          for s in subjects:
              m = re.match(r"(?i)^\s*([a-z]+)(\([^)]*\))?\s*[:：]\s*(.+)$", s)
              prefix = m.group(1).lower() if m else ""
              title = m.group(3).strip() if m else s
              if prefix == "feat":
                  groups["Features"].append(title)
              elif prefix == "fix":
                  groups["Fixes"].append(title)
              elif prefix in ("ui", "opt"):
                  groups["Improvements"].append(title)
              elif prefix in ("ci", "build", "chore", "docs"):
                  groups["Chores"].append(title)
              else:
                  groups["Other"].append(title)
          print("## Changes")
          print()
          for name, items in groups.items():
              if not items:
                  continue
              print("### " + name)
              print()
              for item in items:
                  print("- " + item)
              print()
          PYEOF

          echo "Auto-generated notes saved."

      # ============================================================
      # Step 10: Assemble Release Body
      # ============================================================
      - name: Assemble Release Body
        run: |
          : > release_body.md
          NEED_SEP=0
          if [ -n "$(sed '/^[[:space:]]*$/d' /tmp/cn_notes.txt)" ]; then
            {
              echo "## Release Highlights"
              echo ""
              cat /tmp/cn_notes.txt
            } >> release_body.md
            NEED_SEP=1
          fi
          if [ -n "$(sed '/^[[:space:]]*$/d' /tmp/en_notes.txt)" ]; then
            if [ "$NEED_SEP" = "1" ]; then
              printf '\n---\n\n' >> release_body.md
            fi
            {
              echo "## English Highlights"
              echo ""
              cat /tmp/en_notes.txt
            } >> release_body.md
            NEED_SEP=1
          fi

          if [ "$NEED_SEP" = "1" ]; then
            printf '\n---\n\n' >> release_body.md
          fi
          cat >> release_body.md << ENDOFBODY
          ## Release Metadata
          - **Version:** \`${{ steps.meta.outputs.version_name }}\`
          - **Codename:** \`${{ steps.meta.outputs.codename }}\`
          - **MD5:** \`${{ steps.md5.outputs.md5 }}\`

          ---

          ENDOFBODY

          cat /tmp/auto_notes.md >> release_body.md

          echo "=== Release body preview (first 40 lines) ==="
          head -n 40 release_body.md

      # ============================================================
      # Step 11: Create GitHub Release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.version_name }}
          body_path: release_body.md
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          make_latest: ${{ steps.meta.outputs.is_prerelease == 'false' }}
          discussion_category_name: announcements
          files: |
            ${{ steps.artifacts.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Step 12: Sync Release to Gitee
      # ============================================================
      - name: Prepare Gitee release body
        id: gitee_body
        if: ${{ steps.gitee_check.outputs.has_token == 'true' }}
        shell: bash
        run: |
          echo "body<<GITEEDONE" >> "$GITHUB_OUTPUT"
          cat release_body.md >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "GITEEDONE" >> "$GITHUB_OUTPUT"

      - name: Sync Release to Gitee
        if: ${{ steps.gitee_check.outputs.has_token == 'true' }}
        uses: nICEnnnnnnnLee/action-gitee-release@master
        with:
          gitee_action: create_release
          gitee_owner: franklinsmithson
          gitee_repo: Capsulyric
          gitee_token: ${{ secrets.gitee_token || secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ steps.meta.outputs.tag_name }}
          gitee_release_name: ${{ steps.meta.outputs.version_name }}
          gitee_release_body: ${{ steps.gitee_body.outputs.body }}
          gitee_target_commitish: ${{ github.ref_name }}
          gitee_files: ${{ steps.artifacts.outputs.apk }}

      # ============================================================
      # Step 12.1: Publish Release to AppShare
      # ============================================================
      - name: Publish Release to AppShare
        if: success()
        env:
          appKey: ${{ secrets.appKey }}
          APPSHARE_APP_KEY: ${{ secrets.appKey }}
        shell: bash
        run: |
          python3 .github/scripts/publish_appshare.py \
            --apk "${{ steps.artifacts.outputs.apk }}" \
            --name "${{ steps.artifacts.outputs.apk }}" \
            --app-id "AC0100AE9F074DEE9A71C8" \
            --version-code "${{ steps.meta.outputs.commit_count }}" \
            --version-name "${{ steps.meta.outputs.version_name }}" \
            --channel "${{ steps.meta.outputs.channel }}" \
            --changelog-file "/tmp/cn_notes.txt" \
            --link "https://github.com/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag_name }}"

      # ============================================================
      # Step 12.2: Prune old releases — keep 15 most recent Version.* (GitHub + Gitee)
      # ============================================================
      - name: Prune old GitHub releases (keep 15)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning GitHub releases — keep 15 most recent Version.*"
          TAGS=$(gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^Version\.")) ] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' 2>/dev/null || true)
          if [ -z "$TAGS" ]; then
            echo "No GitHub releases to prune."
            exit 0
          fi
          echo "$TAGS" | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting GitHub release/tag: $tag"
            gh release delete "$tag" --yes || echo "gh release delete failed for $tag (maybe already removed)"
            git push origin --delete "$tag" || echo "git push delete failed for $tag"
          done

      - name: Prune old Gitee releases (keep 15)
        if: ${{ steps.gitee_check.outputs.has_token == 'true' }}
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.gitee_token || secrets.GITEE_TOKEN }}
        run: |
          echo "Pruning Gitee releases — keep 15 most recent Version.*"
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN empty, skipping"
            exit 0
          fi
          RESP=$(curl -s "https://gitee.com/api/v5/repos/franklinsmithson/Capsulyric/releases?access_token=${GITEE_TOKEN}&per_page=100&page=1")
          if ! echo "$RESP" | jq -e 'type=="array"' >/dev/null 2>&1; then
            echo "Gitee API did not return array: $RESP"
            exit 0
          fi
          TAGS=$(echo "$RESP" | jq -r '[.[] | select(.tag_name | test("^Version\.")) ] | sort_by(.created_at) | reverse | .[15:] | .[].tag_name' 2>/dev/null || true)
          if [ -z "$TAGS" ]; then
            echo "No Gitee releases to prune."
            exit 0
          fi
          echo "$TAGS" | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting Gitee release/tag: $tag"
            curl -s -X DELETE "https://gitee.com/api/v5/repos/franklinsmithson/Capsulyric/releases/tags/$tag?access_token=${GITEE_TOKEN}" || echo "Gitee delete failed for $tag"
          done

      # ============================================================
      # Step 13: Upload Workflow Artifact
      # ============================================================
      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Capsulyric-${{ steps.meta.outputs.channel }}-Signed
          path: |
            ${{ steps.artifacts.outputs.apk }}
