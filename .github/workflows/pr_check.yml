name: PR Check

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # NOTE: this job name is used as the required status check in branch
  # protection rules. Do NOT rename it without updating those rules.
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Debug Sources
        # No -P version flags needed: gradle/scripts/versioning.gradle falls
        # back to the date-based prefix and gradle.properties appCodename.
        # Validates Kotlin, Compose, and resource linking without full APK packaging/dexing.
        run: ./gradlew compileDebugSources --console=plain
